# Test classpath overrides: this file SHADOWS src/main/resources/application.properties
# on the test classpath (test-classes precede classes), so the tests NEVER import the
# project-root .env. That guarantees:
#   - spring.profiles.active=test  (no dev profile, no beauty_room DB)
#   - test DB = beauty_room_test with create-drop + import.sql (isolation por contexto)
#   - Flyway validado contra DB limpia, sin tocar la DB real del desarrollador.
spring.profiles.active=test
# Bloquea la importación del .env del proyecto y de cualquier config externa.
spring.config.import=
