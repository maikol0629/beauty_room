<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Horarios — Beauty Room Panel</title>
  <link rel="stylesheet" th:href="@{/css/panel.css}">
</head>
<body>
<nav th:replace="~{panel/fragments :: navbar}"></nav>
<main class="container">
  <div th:replace="~{panel/fragments :: flash}"></div>
  <div style="display:flex; align-items:center; justify-content:space-between;">
    <h2>Horarios de disponibilidad</h2>
    <a class="btn" th:href="@{/panel/schedules/new}">+ Nuevo horario</a>
  </div>

  <div th:each="entry : ${schedulesByStylist}">
    <h3 th:text="${entry.key}">Estilista</h3>
    <table>
      <thead>
      <tr>
        <th>Día</th>
        <th>Inicio</th>
        <th>Fin</th>
        <th></th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="schedule : ${entry.value}">
        <td th:text="${schedule.day}">MONDAY</td>
        <td th:text="${#temporals.format(schedule.startTime, 'HH:mm')}">09:00</td>
        <td th:text="${#temporals.format(schedule.endTime, 'HH:mm')}">18:00</td>
        <td>
          <form style="display:inline" th:action="@{/panel/schedules/{id}/delete(id=${schedule.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-danger btn-sm"
                    onclick="return confirm('¿Eliminar este horario?');">Eliminar</button>
          </form>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(entry.value)}">
        <td colspan="4" class="muted">Sin horarios cargados.</td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
