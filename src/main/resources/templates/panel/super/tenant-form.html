<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Nuevo salón — Beauty Room Panel</title>
  <link rel="stylesheet" th:href="@{/css/panel.css}">
</head>
<body>
<nav th:replace="~{panel/fragments :: navbar}"></nav>
<main class="container">
  <div th:replace="~{panel/fragments :: flash}"></div>
  <h2>Nuevo salón</h2>
  <div class="form-card">
    <form th:action="@{/panel/super/tenants}" th:object="${tenant}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <label for="name">Nombre del salón</label>
      <input type="text" id="name" th:field="*{name}" required>
      <div th:if="${#fields.hasErrors('name')}" class="error" th:errors="*{name}"></div>

      <label for="tenantKey">TenantKey (opcional, se genera del nombre)</label>
      <input type="text" id="tenantKey" th:field="*{tenantKey}">

      <div class="form-row">
        <div>
          <label for="plan">Plan</label>
          <select id="plan" th:field="*{plan}">
            <option th:each="p : ${plans}" th:value="${p}" th:text="${p}">PLAN</option>
          </select>
          <div th:if="${#fields.hasErrors('plan')}" class="error" th:errors="*{plan}"></div>
        </div>
        <div>
          <label for="status">Estado</label>
          <select id="status" th:field="*{status}">
            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}">STATUS</option>
          </select>
        </div>
      </div>

      <label for="trialEndsAt">Trial termina (opcional)</label>
      <input type="datetime-local" id="trialEndsAt" th:field="*{trialEndsAt}">

      <hr style="border:none;border-top:1px solid var(--border);margin:20px 0 0;">
      <p class="muted" style="margin-bottom:0;">Usuario administrador del salón (rol ADMIN)</p>

      <label for="adminEmail">Email</label>
      <input type="email" id="adminEmail" th:field="*{adminEmail}" required>
      <div th:if="${#fields.hasErrors('adminEmail')}" class="error" th:errors="*{adminEmail}"></div>

      <label for="adminPassword">Contraseña</label>
      <input type="password" id="adminPassword" th:field="*{adminPassword}" required>
      <div th:if="${#fields.hasErrors('adminPassword')}" class="error" th:errors="*{adminPassword}"></div>

      <div style="margin-top:20px; display:flex; gap:12px;">
        <button type="submit">Crear salón</button>
        <a class="btn btn-outline" th:href="@{/panel/super/tenants}">Cancelar</a>
      </div>
    </form>
  </div>
</main>
</body>
</html>
