<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Estilista — Beauty Room Panel</title>
  <link rel="stylesheet" th:href="@{/css/panel.css}">
</head>
<body>
<nav th:replace="~{panel/fragments :: navbar}"></nav>
<main class="container">
  <h2 th:text="${stylistId != null} ? 'Editar estilista' : 'Nuevo estilista'">Estilista</h2>
  <div class="form-card">
    <form th:action="${stylistId != null} ? @{/panel/stylists/{id}(id=${stylistId})} : @{/panel/stylists}"
          th:object="${stylist}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <label for="name">Nombre</label>
      <input type="text" id="name" th:field="*{name}" required>
      <div th:if="${#fields.hasErrors('name')}" class="error" th:errors="*{name}"></div>

      <label for="email">Email</label>
      <input type="email" id="email" th:field="*{email}" required>
      <div th:if="${#fields.hasErrors('email')}" class="error" th:errors="*{email}"></div>

      <div th:if="${stylistId == null}">
        <label for="password">Contraseña</label>
        <input type="password" id="password" th:field="*{password}" required>
        <div th:if="${#fields.hasErrors('password')}" class="error" th:errors="*{password}"></div>
      </div>

      <label for="phone">Teléfono</label>
      <input type="text" id="phone" th:field="*{phone}" required>
      <div th:if="${#fields.hasErrors('phone')}" class="error" th:errors="*{phone}"></div>

      <p class="muted" style="font-size:13px;">
        Después de crear al estilista vas a ver un enlace para vincular su Telegram: se lo enviás y,
        al tocarlo, el bot lo reconoce automáticamente.
      </p>

      <div style="margin-top:20px; display:flex; gap:12px;">
        <button type="submit" th:text="${stylistId != null} ? 'Guardar cambios' : 'Crear estilista'">Guardar</button>
        <a class="btn btn-outline" th:href="@{/panel/stylists}">Cancelar</a>
      </div>
    </form>
  </div>
</main>
</body>
</html>
