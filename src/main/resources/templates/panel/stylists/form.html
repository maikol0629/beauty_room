<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Estilista — Beauty Room Panel</title>
  <link rel="stylesheet" th:href="@{/css/panel.css}">
</head>
<body>
<nav th:replace="~{panel/fragments :: navbar}"></nav>
<main class="container">
  <h2>Editar estilista</h2>
  <div class="form-card">
    <form th:action="@{/panel/stylists/{id}(id=${stylistId})}" th:object="${stylist}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <label for="name">Nombre</label>
      <input type="text" id="name" th:field="*{name}" required>
      <div th:if="${#fields.hasErrors('name')}" class="error" th:errors="*{name}"></div>

      <label for="email">Email</label>
      <input type="email" id="email" th:field="*{email}" required>
      <div th:if="${#fields.hasErrors('email')}" class="error" th:errors="*{email}"></div>

      <label for="phone">Teléfono</label>
      <input type="text" id="phone" th:field="*{phone}" required>
      <div th:if="${#fields.hasErrors('phone')}" class="error" th:errors="*{phone}"></div>

      <label for="telegramChatId">Chat ID de Telegram (id numérico del chat con el bot)</label>
      <input type="text" id="telegramChatId" th:field="*{telegramChatId}" placeholder="ej: 555000111">
      <p class="muted" style="font-size:13px;">
        Obtenelo con <code>/start</code> en el bot: es el número que aparece en <code>ConversationState</code> o
        escribile a <code>@userinfobot</code>.
      </p>

      <div style="margin-top:20px; display:flex; gap:12px;">
        <button type="submit">Guardar</button>
        <a class="btn btn-outline" th:href="@{/panel/stylists}">Cancelar</a>
      </div>
    </form>
  </div>
</main>
</body>
</html>
