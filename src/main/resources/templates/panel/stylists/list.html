<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Estilistas — Beauty Room Panel</title>
  <link rel="stylesheet" th:href="@{/css/panel.css}">
</head>
<body>
<nav th:replace="~{panel/fragments :: navbar}"></nav>
<main class="container">
  <div th:replace="~{panel/fragments :: flash}"></div>
  <h2>Estilistas</h2>
  <div style="margin-bottom:16px;">
    <a class="btn" th:href="@{/panel/stylists/new}">+ Nuevo estilista</a>
  </div>
  <table>
    <thead>
    <tr>
      <th>Nombre</th>
      <th>Email</th>
      <th>Teléfono</th>
      <th>Telegram</th>
      <th></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="st : ${stylists}">
      <td th:text="${st.name}">Estilista</td>
      <td th:text="${st.email}">email@x.com</td>
      <td th:text="${st.phone}">5551234</td>
      <td>
        <th:block th:if="${st.telegramChatId != null && !st.telegramChatId.isEmpty()}">
          <span class="badge">Vinculado ✓</span>
          <form th:action="@{/panel/stylists/{id}/regenerate-link(id=${st.id})}" method="post" style="display:inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-outline btn-sm">Regenerar enlace</button>
          </form>
        </th:block>
        <th:block th:unless="${st.telegramChatId != null && !st.telegramChatId.isEmpty()}">
          <a th:if="${vincularLinks[st.id] != null}" class="vincular-link" th:href="${vincularLinks[st.id]}"
             th:text="${vincularLinks[st.id]}">t.me/...</a>
          <span th:if="${vincularLinks[st.id] != null}" class="muted" style="font-size:12px;">
            — enviar al estilista para vincular
          </span>
          <button th:if="${vincularLinks[st.id] != null}" type="button" class="btn btn-outline btn-sm"
                  th:attr="data-copy=${vincularLinks[st.id]}" onclick="copiarEnlace(this)">Copiar</button>
          <span th:unless="${vincularLinks[st.id] != null}" class="muted">—</span>
        </th:block>
      </td>
      <td><a class="btn btn-outline btn-sm" th:href="@{/panel/stylists/{id}/edit(id=${st.id})}">Editar</a></td>
    </tr>
    <tr th:if="${#lists.isEmpty(stylists)}">
      <td colspan="5" class="muted">No hay estilistas.</td>
    </tr>
    </tbody>
  </table>
</main>
<script>
  function copiarEnlace(btn) {
    var link = btn.getAttribute('data-copy');
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(link).then(function () { btn.textContent = 'Copiado ✓'; });
    } else {
      window.prompt('Copiá el enlace:', link);
    }
  }
</script>
</body>
</html>
