<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Servicio — Beauty Room Panel</title>
  <link rel="stylesheet" th:href="@{/css/panel.css}">
</head>
<body>
<nav th:replace="~{panel/fragments :: navbar}"></nav>
<main class="container">
  <h2 th:text="${serviceId != null} ? 'Editar servicio' : 'Nuevo servicio'">Nuevo servicio</h2>
  <div class="form-card">
    <form th:action="${serviceId != null} ? @{/panel/services/{id}(id=${serviceId})} : @{/panel/services}"
          th:object="${service}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <label for="name">Nombre</label>
      <input type="text" id="name" th:field="*{name}" required>
      <div th:if="${#fields.hasErrors('name')}" class="error" th:errors="*{name}"></div>

      <label for="description">Descripción</label>
      <textarea id="description" th:field="*{description}" rows="2" required></textarea>
      <div th:if="${#fields.hasErrors('description')}" class="error" th:errors="*{description}"></div>

      <div class="form-row">
        <div>
          <label for="price">Precio</label>
          <input type="number" step="0.01" id="price" th:field="*{price}" required>
          <div th:if="${#fields.hasErrors('price')}" class="error" th:errors="*{price}"></div>
        </div>
        <div>
          <label for="duration">Duración (minutos)</label>
          <input type="number" id="duration" th:field="*{duration}" required>
          <div th:if="${#fields.hasErrors('duration')}" class="error" th:errors="*{duration}"></div>
        </div>
      </div>

      <label for="stylistId">Estilista</label>
      <select id="stylistId" th:field="*{stylistId}">
        <option value="">Seleccionar...</option>
        <option th:each="st : ${stylists}" th:value="${st.id}" th:text="${st.name}">Estilista</option>
      </select>
      <div th:if="${#fields.hasErrors('stylistId')}" class="error" th:errors="*{stylistId}"></div>

      <div style="margin-top:20px; display:flex; gap:12px;">
        <button type="submit" th:text="${serviceId != null} ? 'Guardar cambios' : 'Crear servicio'">Guardar</button>
        <a class="btn btn-outline" th:href="@{/panel/services}">Cancelar</a>
      </div>
    </form>
  </div>
</main>
</body>
</html>
