<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Iniciar sesión — Beauty Room</title>
  <link rel="stylesheet" th:href="@{/css/panel.css}">
</head>
<body class="login-body">
<div class="login-card">
  <h1>Beauty Room</h1>
  <p class="muted">Panel de administración del salón</p>
  <div th:if="${param.error}" class="alert alert-danger">Usuario o contraseña incorrectos</div>
  <div th:if="${param.logout}" class="alert alert-success">Sesión cerrada correctamente</div>
  <form th:action="@{/panel/login}" method="post">
    <label for="username">Email</label>
    <input type="email" id="username" name="username" required autofocus>
    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" required>
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <button type="submit">Entrar</button>
  </form>
</div>
</body>
</html>
