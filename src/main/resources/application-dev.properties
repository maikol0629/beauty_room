spring.config.activate.on-profile=dev

# Database
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/beauty_room}
spring.datasource.username=${DB_USERNAME:dev}
spring.datasource.password=${DB_PASSWORD:dev123}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.mariadb.jdbc.Driver}

# Hibernate
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.MariaDBDialect}
spring.jpa.generate-ddl=false
# Flyway gestiona el esquema; Hibernate valida que coincida con las entidades.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:true}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:DEBUG}
logging.level.org.hibernate.resource.jdbc=${HIBERNATE_JDBC_LOG_LEVEL:DEBUG}
# El seed vive en V2__seed_data.sql. import.sql solo se usa en el perfil test.
spring.jpa.properties.hibernate.hbm2ddl.import_files=${IMPORT_SQL_FILE:}
spring.sql.init.mode=${SQL_INIT_MODE:never}

# Flyway activo (baseline-on-migrate=true) para adoptar la DB local existente sin romperla.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}

# JWT
jwt.secret-key=${JWT_SECRET_KEY:change-me-in-dev-and-prod-with-a-much-longer-secret-key-64chars!!}

# Telegram Bot
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:}
telegram.bot.path=${TELEGRAM_BOT_PATH:/api/telegram/webhook}
telegram.bot.webhook-url=${TELEGRAM_BOT_WEBHOOK_URL:}

# Reminders
app.reminders.interval=${REMINDERS_INTERVAL:0 */15 * * * *}
app.reminders.daily-summary=${REMINDERS_DAILY_SUMMARY:0 0 7 * * *}