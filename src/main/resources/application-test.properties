spring.config.activate.on-profile=test

# Test profile
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.resource.jdbc=OFF
spring.sql.init.mode=${SQL_INIT_MODE:always}

# Isolated test database defaults
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/beauty_room_test}
spring.datasource.username=${DB_USERNAME:dev}
spring.datasource.password=${DB_PASSWORD:dev123}

# Flyway desactivado: esquema gestionado por Hibernate (create-drop) + import.sql.
spring.flyway.enabled=${FLYWAY_ENABLED:false}

# Disable external integrations in tests
telegram.bot.token=
telegram.bot.username=
telegram.bot.webhook-url=

spring.jpa.properties.hibernate.hbm2ddl.import_files=${IMPORT_SQL_FILE:import.sql}
