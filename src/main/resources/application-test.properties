spring.config.activate.on-profile=test

# Test profile
# Aislamiento por contexto: create-drop + import.sql re-siembran en CADA contexto de test.
# Flyway NO se ejecuta en tests: el esquema lo define Hibernate desde las entidades y V1 debe
# coincidir (se valida aparte contra DB limpia en la Fase 4 del plan de mejora).
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.resource.jdbc=OFF
spring.sql.init.mode=${SQL_INIT_MODE:always}

# Isolated test database defaults
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/beauty_room_test}
spring.datasource.username=${DB_USERNAME:dev}
spring.datasource.password=${DB_PASSWORD:dev123}

# Flyway desactivado en tests (create-drop + import.sql dan aislamiento suficiente).
spring.flyway.enabled=false

# Disable external integrations in tests
telegram.bot.token=
telegram.bot.username=
telegram.bot.path=/api/telegram/webhook
telegram.bot.webhook-url=

# Base config que el test-classpath application.properties no hereda de la principal
jwt.secret-key=test-secret-key-for-jwt-hs256-with-more-than-32-chars
app.reminders.interval=0 */15 * * * *
app.reminders.daily-summary=0 0 7 * * *

spring.jpa.properties.hibernate.hbm2ddl.import_files=${IMPORT_SQL_FILE:import.sql}
