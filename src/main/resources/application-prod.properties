spring.config.activate.on-profile=prod

# Production profile
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.resource.jdbc=ERROR
spring.sql.init.mode=${SQL_INIT_MODE:always}

# Production database must come from environment variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway desactivado: esquema gestionado por Hibernate (create-drop) + import.sql.
spring.flyway.enabled=${FLYWAY_ENABLED:false}

# Telegram should only be enabled when explicitly configured
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:}
telegram.bot.webhook-url=${TELEGRAM_BOT_WEBHOOK_URL:}

# Seed data activo (MVP): import.sql se re-ejecuta en cada arranque
spring.jpa.properties.hibernate.hbm2ddl.import_files=${IMPORT_SQL_FILE:import.sql}
