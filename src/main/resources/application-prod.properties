spring.config.activate.on-profile=prod

# Production profile
spring.jpa.generate-ddl=false
# Flyway gestiona el esquema; Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.resource.jdbc=ERROR
# Sin seed automático: el seed solo vive en V2__seed_data.sql (Flyway, idempotente).
spring.sql.init.mode=never
spring.jpa.properties.hibernate.hbm2ddl.import_files=

# Production database must come from environment variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway OBLIGATORIO en prod (sin fallback a false): baseline para adoptar DBs existentes.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
