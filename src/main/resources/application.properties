spring.application.name=beauty_room
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.config.import=optional:file:./.env[.properties]

# Database
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/beauty_room}
spring.datasource.username=${DB_USERNAME:dev}
spring.datasource.password=${DB_PASSWORD:dev123}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.mariadb.jdbc.Driver}

# Hibernate
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.MariaDBDialect}
spring.jpa.generate-ddl=false
# El esquema lo gestiona Flyway; Hibernate solo valida. create-drop queda SOLO para el perfil test (aislamiento).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:true}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:DEBUG}
logging.level.org.hibernate.resource.jdbc=${HIBERNATE_JDBC_LOG_LEVEL:DEBUG}
# El seed vive en V2__seed_data.sql (Flyway). import.sql solo se usa en el perfil test.
spring.jpa.properties.hibernate.hbm2ddl.import_files=${IMPORT_SQL_FILE:}
spring.sql.init.mode=${SQL_INIT_MODE:never}

# Flyway activo por defecto (Fase 2 del plan de mejora): el esquema lo gestionan las
# migraciones versionadas en db/migration. baseline-on-migrate permite adoptar DBs
# existentes sin romper nada.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}

# Tomcat / temp files
server.port=${SERVER_PORT:8080}
server.tomcat.basedir=${TOMCAT_BASE_DIR:target/tomcat}

# JWT
jwt.secret-key=${JWT_SECRET_KEY:change-me-in-dev-and-prod-with-a-much-longer-secret-key-64chars!!}

# Telegram Bot
# Deja el token vacío y el bot no se registra; la app arranca igual.
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:}
# Path del endpoint webhook que recibe los updates de Telegram
telegram.bot.path=${TELEGRAM_BOT_PATH:/api/telegram/webhook}
# URL pública HTTPS donde Telegram hará POST.
# Si está vacía, se omite la llamada setWebhook y solo se loguea un warning.
telegram.bot.webhook-url=${TELEGRAM_BOT_WEBHOOK_URL:}

# Recordatorios automáticos (Fase 5)
# Cron del job que envía recordatorios 24h/2h antes al cliente y del resumen diario al estilista.
# Con telegram.bot.token y whatsapp.access-token vacíos el job no envía nada (solo loguea un warning).
app.reminders.interval=${REMINDERS_INTERVAL:0 */15 * * * *}
app.reminders.daily-summary=${REMINDERS_DAILY_SUMMARY:0 0 7 * * *}

# Super admin de la plataforma (se crea al arrancar si no existe)
app.superadmin.email=${SUPER_ADMIN_EMAIL:superadmin@beautyroom.app}
app.superadmin.password=${SUPER_ADMIN_PASSWORD:superadmin123}

# WhatsApp (Meta Cloud API) — Fase 12
# Deja access-token y phone-number-id vacíos y el canal no envía ni procesa WhatsApp.
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.phone-number=${WHATSAPP_PHONE_NUMBER:}
whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:}
# App secret de la app de Meta; verifica la firma X-Hub-Signature-256 del webhook.
whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
whatsapp.api-version=${WHATSAPP_API_VERSION:v21.0}
whatsapp.path=${WHATSAPP_PATH:/api/whatsapp/webhook}
whatsapp.webhook-url=${WHATSAPP_WEBHOOK_URL:}