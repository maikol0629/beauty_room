spring.application.name=beauty_room
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.config.import=optional:file:./.env[.properties]

# Database
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/beauty_room}
spring.datasource.username=${DB_USERNAME:dev}
spring.datasource.password=${DB_PASSWORD:dev123}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.mariadb.jdbc.Driver}

# Hibernate
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:true}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:DEBUG}
logging.level.org.hibernate.resource.jdbc=${HIBERNATE_JDBC_LOG_LEVEL:DEBUG}
spring.jpa.properties.hibernate.hbm2ddl.import_files=${IMPORT_SQL_FILE:import.sql}
spring.sql.init.mode=${SQL_INIT_MODE:always}

# Flyway desactivado por defecto: el esquema lo gestiona Hibernate (create-drop) + import.sql.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}

# Tomcat / temp files
server.port=${SERVER_PORT:8080}
server.tomcat.basedir=${TOMCAT_BASE_DIR:target/tomcat}

# JWT
jwt.secret-key=${JWT_SECRET_KEY:change-me-in-dev-and-prod-with-a-much-longer-secret-key-64chars!!}

# Telegram Bot
# Deja el token vacío y el bot no se registra; la app arranca igual.
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:}
# Path del endpoint webhook que recibe los updates de Telegram
telegram.bot.path=${TELEGRAM_BOT_PATH:/api/telegram/webhook}
# URL pública HTTPS donde Telegram hará POST.
# Si está vacía, se omite la llamada setWebhook y solo se loguea un warning.
telegram.bot.webhook-url=${TELEGRAM_BOT_WEBHOOK_URL:}

# Recordatorios automáticos (Fase 5)
# Cron del job que envía recordatorios 24h/2h antes al cliente y del resumen diario al estilista.
# Con telegram.bot.token vacío el job no envía nada (solo loguea un warning).
app.reminders.interval=${REMINDERS_INTERVAL:0 */15 * * * *}
app.reminders.daily-summary=${REMINDERS_DAILY_SUMMARY:0 0 7 * * *}