spring.application.name=beauty_room

#Database
spring.datasource.url=jdbc:mariadb://localhost:3306/beauty_room
spring.datasource.username=dev
spring.datasource.password=dev123
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

#Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.resource.jdbc=DEBUG
spring.jpa.properties.hibernate.hbm2ddl.import_files=import.sql
spring.sql.init.mode=always

#JWT
jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

#Telegram Bot
# Deja token/vacio y el bot NO se registra (la app arranca igual). Completa con los datos de BotFather.
telegram.bot.token=
telegram.bot.username=
# Path del endpoint webhook que recibe los updates de Telegram
telegram.bot.path=/api/telegram/webhook
# URL publica HTTPS donde Telegram hara POST (ej: https://tu-subdominio.ngrok.io/api/telegram/webhook).
# Si esta vacia, se omite la llamada setWebhook y solo se loguea un warning.
telegram.bot.webhook-url=